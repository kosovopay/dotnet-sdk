name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet: [ "8.0.x", "9.0.x" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore dependencies
        run: dotnet restore KosovoPay.sln

      - name: Build
        run: dotnet build KosovoPay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KosovoPay.sln --configuration Release --no-build --verbosity normal

      - name: Format check
        run: dotnet format KosovoPay.sln --verify-no-changes --verbosity diagnostic
